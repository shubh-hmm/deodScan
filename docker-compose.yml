# Production-style Postgres. The Node services (api, worker, web) run with `npm run ...` (see README).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: deod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deod}
      POSTGRES_DB: deod_monitor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deod -d deod_monitor"]
      interval: 10s
      retries: 5
volumes:
  pgdata:
